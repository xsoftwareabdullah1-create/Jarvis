name: Build JARVIS APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Android project
        run: |
          if [ ! -f settings.gradle ] && [ -f jarvis_final/settings.gradle ]; then
            echo "PROJECT_DIR=jarvis_final" >> "$GITHUB_ENV"
          else
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2.1"

      - name: Install Android SDK components
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Using Android SDK: $SDK"

          SDKMANAGER=$(find "$SDK/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found at $SDK"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Build release APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace assembleRelease

      - name: Prepare APK
        run: |
          mkdir -p output
          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/release" \
            -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found"
            exit 1
          fi

          cp "$APK" output/Jarvis.apk
          ls -lh output/Jarvis.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis
          path: output/Jarvis.apk
          if-no-files-found: error
