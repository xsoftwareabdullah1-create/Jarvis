name: Build JARVIS APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0
          accept-android-sdk-licenses: true

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            PROJECT_DIR="."
          elif [ -f "jarvis_final/settings.gradle" ] || \
               [ -f "jarvis_final/settings.gradle.kts" ]; then
            PROJECT_DIR="jarvis_final"
          else
            PROJECT_DIR=""

            while IFS= read -r file; do
              dir=$(dirname "$file")
              if [ -f "$dir/app/build.gradle" ] || \
                 [ -f "$dir/app/build.gradle.kts" ]; then
                PROJECT_DIR="$dir"
                break
              fi
            done < <(
              find . -maxdepth 5 -type f \
                \( -name settings.gradle -o \
                   -name settings.gradle.kts \)
            )
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."
            find . -maxdepth 4 -type f | head -200
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: App module Gradle file not found."
            find "$PROJECT_DIR" -maxdepth 4 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found: $PROJECT_DIR"

      - name: Verify Java and Android SDK
        run: |
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --list_installed

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon --stacktrace assembleRelease
          elif command -v gradle >/dev/null 2>&1; then
            gradle --no-daemon --stacktrace assembleRelease
          else
            echo "ERROR: Gradle wrapper and Gradle not found."
            exit 1
          fi

      - name: Prepare APK
        shell: bash
        run: |
          set -e
          mkdir -p output

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f -name "*.apk" -print -quit 2>/dev/null || true)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            find "$PROJECT_DIR" -path "*/build/outputs/*" -type f
            exit 1
          fi

          cp "$APK" output/Jarvis.apk
          ls -lh output/Jarvis.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK
          path: output/Jarvis.apk
          if-no-files-found: error
          retention-days: 7
