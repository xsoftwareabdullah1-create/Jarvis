
name: Build JARVIS APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android project
        run: |
          if [ -f "settings.gradle" ] && [ -f "app/build.gradle" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f "jarvis_final/settings.gradle" ] && [ -f "jarvis_final/app/build.gradle" ]; then
            echo "PROJECT_DIR=jarvis_final" >> "$GITHUB_ENV"
          else
            echo "ERROR: Android project files not found."
            find . -maxdepth 3 -type f | sort | head -200
            exit 1
          fi

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Setup Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2.1"

      - name: Build release APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace assembleRelease

      - name: Prepare APK
        run: |
          mkdir -p output

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/release" \
            -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          cp "$APK" output/Jarvis.apk
          ls -lh output/Jarvis.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis
          path: output/Jarvis.apk
          if-no-files-found: error
