name: Build JARVIS APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Verify build environment
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed

      - name: Build release APK
        run: gradle --no-daemon --stacktrace --warning-mode all clean assembleRelease

      - name: Rename and verify APK
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk output/Jarvis.apk
          test -s output/Jarvis.apk
          ls -lh output/Jarvis.apk

      - name: Upload Jarvis.apk
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis
          path: output/Jarvis.apk
          if-no-files-found: error
          retention-days: 14
          
