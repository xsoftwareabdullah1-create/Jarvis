name: Build JARVIS APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2.1"

      - name: Build APK
        run: |
          gradle --no-daemon --stacktrace assembleRelease

      - name: Find APK
        run: |
          echo "APK files:"
          find . -type f -name "*.apk" -print

      - name: Prepare APK
        run: |
          mkdir -p output

          APK=$(find app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          cp "$APK" output/Jarvis.apk

          echo "SUCCESS:"
          ls -lh output/Jarvis.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis
          path: output/Jarvis.apk
          if-no-files-found: error
