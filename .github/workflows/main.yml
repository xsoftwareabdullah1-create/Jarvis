name: Build JARVIS APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      # assembleDebug = auto-signed APK, installs on any phone.
      # (Task names are case-sensitive: assembleDebug, not assembledebug.)
      - name: Build APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Rename APK to Jarvis.apk
        run: |
          mkdir -p output
          APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found: $APK"
          cp "$APK" output/Jarvis.apk
          ls -lh output/Jarvis.apk

      - name: Upload Jarvis.apk
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis
          path: output/Jarvis.apk
          if-no-files-found: error
          retention-days: 14
